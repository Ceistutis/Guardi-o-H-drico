[theme]
base = "light"
primaryColor = "#007F83"
backgroundColor = "#F1F6FA"
secondaryBackgroundColor = "#E8F0F5"
textColor = "#10283F"
borderColor = "#CFDDE7"
font = "sans serif"
baseFontSize = 17
headingFontSizes = ["2.5rem", "1.6rem", "1.25rem"]

[theme.sidebar]
primaryColor = "#32D4D0"
backgroundColor = "#10283F"
secondaryBackgroundColor = "#1C3A53"
textColor = "#FFFFFF"
borderColor = "#39566B"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
